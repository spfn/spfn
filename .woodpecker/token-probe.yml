# TEMPORARY debug probe for the gitea_npm_token secret (w-wvy3y, E401 on publish).
# Prints only the injected value's length and sha256 prefix — never the value —
# plus Gitea API status codes, to tell apart: wrong/empty value in CI, auth
# headers lost on the CI→Gitea network path, or an npm-endpoint-specific refusal.
# Delete this file and its branch when the debugging session ends.
when:
    branch: debug/wp-token-probe
    event: [push, manual]

steps:
    probe:
        image: node:22
        environment:
            GITEA_NPM_TOKEN: { from_secret: gitea_npm_token }
        commands:
            - echo "len=${#GITEA_NPM_TOKEN}"
            - printf '%s' "$GITEA_NPM_TOKEN" | sha256sum | cut -c1-12
            - curl -s -o /dev/null -w 'user-api-token-scheme %{http_code}\n' -H "Authorization: token $GITEA_NPM_TOKEN" https://git.superfunction.xyz/api/v1/user
            - curl -s -o /dev/null -w 'npm-meta-bearer-scheme %{http_code}\n' -H "Authorization: Bearer $GITEA_NPM_TOKEN" "https://git.superfunction.xyz/api/packages/superfunction/npm/@spfn%2Fcore"
            - curl -s -o /dev/null -w 'no-auth-baseline %{http_code}\n' https://git.superfunction.xyz/api/v1/user
