version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms_test_postgres
    environment:
      POSTGRES_USER: cmstest
      POSTGRES_PASSWORD: cmstest123
      POSTGRES_DB: spfn_cms_test
    ports:
      - '5436:5432'
    volumes:
      - cms_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cmstest']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cms_postgres_test_data: