services:
  # PostgreSQL for testing
  postgres:
    image: postgres:16-alpine
    container_name: spfn-test-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: spfn_test
    ports:
      - '5532:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d spfn_test']
      interval: 5s
      timeout: 5s
      retries: 5

  # Single Valkey instance (for basic tests)
  valkey-single:
    image: valkey/valkey:8.0
    container_name: spfn-valkey-single
    ports:
      - "6479:6379"
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Master instance (for master-replica tests)
  valkey-master:
    image: valkey/valkey:8.0
    container_name: spfn-valkey-master
    ports:
      - "6480:6379"
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Replica instance (for master-replica tests)
  valkey-replica:
    image: valkey/valkey:8.0
    container_name: spfn-valkey-replica
    ports:
      - "6481:6379"
    command: valkey-server --replicaof valkey-master 6379 --appendonly yes
    depends_on:
      valkey-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Valkey with authentication (for auth tests)
  valkey-auth:
    image: valkey/valkey:8.0
    container_name: spfn-valkey-auth
    ports:
      - "6482:6379"
    command: valkey-server --requirepass secret123
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "secret123", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  postgres_test_data:

networks:
  default:
    name: spfn-test-network