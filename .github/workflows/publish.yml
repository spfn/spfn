name: Publish All Packages

on:
  push:
    tags:
      - 'v*'  # 모든 패키지 동시 배포 (버전 릴리스)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance를 위한 OIDC 토큰 권한

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Publish @spfn/core
        working-directory: packages/core
        run: pnpm publish --access public --tag alpha --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish spfn
        working-directory: packages/cli
        run: pnpm publish --access public --tag alpha --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @spfn/cms
        working-directory: packages/cms
        run: pnpm publish --access public --tag alpha --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @spfn/auth
        working-directory: packages/auth
        run: pnpm publish --access public --tag alpha --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Add latest tags
        run: |
          npm dist-tag add @spfn/core@$(node -p "require('./packages/core/package.json').version") latest
          npm dist-tag add spfn@$(node -p "require('./packages/cli/package.json').version") latest
          npm dist-tag add @spfn/cms@$(node -p "require('./packages/cms/package.json').version") latest
          npm dist-tag add @spfn/auth@$(node -p "require('./packages/auth/package.json').version") latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}