name: Security audit

# A vulnerability usually arrives after the code is written, not with it — the Next.js
# RSC advisory (CVE-2025-66478) landed months after the affected ranges were committed.
# A pull-request check would not have caught it. The schedule is the control that matters;
# the push and dispatch triggers are for confirming a fix without waiting a day.

on:
  schedule:
    # 00:00 UTC daily — 09:00 KST
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the run. Only the production dependency graph counts here: a build-tool
      # advisory does not reach an app that installs @spfn/*.
      #
      # The level is `high` because the graph has no high finding left to forgive. Two
      # moderate ones remain and are settled rather than fixed: @hono/node-server's
      # patched line requires Node 20, which is a decision about the framework's
      # supported range, and gaxios reaches uuid only through v4 while the advisory is
      # about v3/v5/v6. Setting `moderate` today would fail every run on those two.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Reports without failing. The moderate and low findings above are recorded rather
      # than blocking every run.
      - name: Report every finding
        if: always()
        run: |
          {
            echo '## Production dependencies'
            echo '```'
            pnpm audit --prod 2>&1 | tail -20 || true
            echo '```'
            echo '## Including build tooling'
            echo '```'
            pnpm audit 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
